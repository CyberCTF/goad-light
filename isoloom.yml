# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD-Light (Game of Active Directory, by Orange Cyberdefense) as an Isoloom spec: three Windows
# Server 2019 machines, two domains with a trust, provisioned by GOAD's own Ansible from a
# controller Isoloom adds. `isoloom generate`, then `cd .isoloom/vagrant && vagrant up`.
version: 1
name: goad-light

networks:
  lab: { cidr: 192.168.56.0/24 }

# Every machine is a Windows Server 2019 box that only sets up WinRM itself; GOAD's Ansible does
# the rest from the controller. Said once here; a machine's own value wins.
common:
  resources: { cpus: 2, memory_mb: 3000 }
  vm:
    os: windows-server-2019
    provision: [vagrant/ConfigureRemotingForAnsible.ps1]

groups:
  domain-controllers:
    members: [dc01, dc02]

machines:
  dc01:   # kingslanding: sevenkingdoms.local
    networks: { lab: 10 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    vm: {}

  dc02:   # winterfell: north.sevenkingdoms.local
    networks: { lab: 11 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    vm: {}

  srv02:  # castelblack: IIS and MSSQL in the north
    networks: { lab: 22 }
    services: [{ port: 80, name: iis, http: true }, { port: 1433, name: mssql }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 6000 }
    vm: {}

provision:
  - ansible: ansible/main.yml
    requirements: ansible/requirements_311.yml
    # The lab's own per-host variables (which domain each machine belongs to) and the keyboard layouts.
    inventory: [ad/GOAD-Light/data/inventory]
    # What each machine plays in the lab: the groups GOAD's playbooks target.
    groups:
      domain: [dc01, dc02, srv02]
      dc: [dc01, dc02]
      server: [srv02]
      parent_dc: [dc01]
      child_dc: [dc02]
      adcs: [dc01]
      iis: [srv02]
      mssql: [srv02]
      mssql_ssms: [srv02]
      webdav: [srv02]
      update: [srv02]
      no_update: [dc01, dc02]
      defender_on: [dc01, dc02]
      defender_off: [srv02]
    # The lab's settings, as GOAD's playbooks read them.
    vars:
      domain_name: GOAD-Light
      admin_user: administrator
      force_dns_server: 'no'
      dns_server: 'x.x.x.x'
      dns_server_forwarder: 1.1.1.1
      enable_http_proxy: 'no'
      ad_http_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      ad_https_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      add_route: 'no'
      route_gateway: 192.168.56.1
      route_network: 10.0.0.0/8
      proxy_ip: 'x.x.x.x'
      proxy_port: '8080'

message: |
  GOAD-Light is up. kingslanding (sevenkingdoms.local) at {{ machines.dc01.addresses.lab }},
  winterfell (north.sevenkingdoms.local) at {{ machines.dc02.addresses.lab }}, castelblack
  (IIS, MSSQL) at {{ machines.srv02.addresses.lab }}. Start from the north.
